<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDM Admin Dashboard</title>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#1e3a5f,#0f172a 70%)}
.lc{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:40px;width:100%;max-width:380px}
.ll{font-size:36px;text-align:center;margin-bottom:8px}
.lt{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
.ls{text-align:center;color:#64748b;font-size:13px;margin-bottom:28px}
.lf{margin-bottom:16px}
.lf label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
.lf input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#f1f5f9;font-size:15px;padding:12px 14px;outline:none}
.lf input:focus{border-color:#3b82f6}
.lb{width:100%;padding:14px;background:#3b82f6;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.le{color:#ef4444;font-size:13px;text-align:center;margin-top:10px;display:none}
#dashboard{display:none}
header{background:#1e293b;border-bottom:1px solid #334155;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hl{display:flex;align-items:center;gap:12px}
.hlogo{width:34px;height:34px;background:#3b82f6;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.ht{font-size:16px;font-weight:700}
.hs{font-size:11px;color:#64748b}
.hr{display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.logbtn{background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
main{padding:20px;max-width:1300px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px 18px}
.sl{font-size:11px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
.sv{font-size:26px;font-weight:700}
.blue{color:#60a5fa}.green{color:#4ade80}.amber{color:#fbbf24}.purple{color:#c084fc}.red{color:#f87171}
.filters{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filters input,.filters select{background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;font-size:13px;padding:8px 11px;outline:none}
.filters input{flex:1;min-width:180px}
.ebtn{background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tw{background:#1e293b;border:1px solid #334155;border-radius:14px;overflow:hidden}
.thead{padding:14px 18px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between}
.thead span{font-size:14px;font-weight:600}
.thead small{font-size:12px;color:#64748b}
table{width:100%;border-collapse:collapse}
thead tr{background:#0f172a}
th{padding:11px 14px;text-align:left;font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid #334155}
td{padding:10px 14px;font-size:12px;border-bottom:1px solid #1a2535;vertical-align:middle}
tr:hover td{background:#1a2535}
tr:last-child td{border-bottom:none}
.av{width:28px;height:28px;border-radius:6px;background:#1d4ed8;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#bfdbfe;margin-right:6px;vertical-align:middle}
.bp{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px}
.bp-blue{background:#1e3a5f;color:#60a5fa}
.bp-green{background:#14532d;color:#4ade80}
.bp-amber{background:#451a03;color:#fbbf24}
.bp-red{background:#450a0a;color:#f87171}
.bp-purple{background:#3b0764;color:#c084fc}
.ab{background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer;margin-right:3px}
.ab:hover{background:#1e3a5f;color:#60a5fa;border-color:#3b82f6}
.pb{background:#7c3aed22;border:1px solid #7c3aed55;color:#a78bfa;border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer}
.pb:hover{background:#7c3aed;color:#fff}
.empty{text-align:center;padding:50px;color:#475569}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
#modal.open{display:flex}
.mc{background:#1e293b;border:1px solid #334155;border-radius:18px;width:100%;max-width:640px;margin:auto}
.mh{padding:16px 22px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#1e293b;border-radius:18px 18px 0 0;z-index:1}
.mh h2{font-size:15px;font-weight:600}
.xcb{background:transparent;border:none;color:#64748b;font-size:20px;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.xcb:hover{background:#334155;color:#f1f5f9}
.mb{padding:20px 22px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.pt{border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:#0f172a;border:1px solid #334155}
.pt img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.pt .np{display:flex;align-items:center;justify-content:center;height:100%;color:#475569;font-size:20px}
.pc{font-size:10px;color:#64748b;text-align:center;margin-top:4px}
.dr{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid #1a2535}
.dr:last-child{border-bottom:none}
.dl{font-size:11px;color:#64748b;font-weight:600;min-width:130px}
.dv{font-size:12px;color:#f1f5f9;text-align:right;word-break:break-all;max-width:280px}
.st{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid #334155}
.mf{padding:14px 22px;border-top:1px solid #334155;display:flex;gap:10px}
.mpdf{flex:1;padding:10px;background:#7c3aed;color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.mclose{padding:10px 16px;background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:9px;font-size:13px;cursor:pointer}
.yn-yes{color:#22c55e;font-weight:600}
.yn-no{color:#ef4444;font-weight:600}
@media(max-width:700px){th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}main{padding:12px}}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="lc">
    <div class="ll">🔐</div>
    <div class="lt">Admin Login</div>
    <div class="ls">EDM Inspection Dashboard</div>
    <div class="lf"><label>Username</label><input type="text" id="lu" value="admin"></div>
    <div class="lf"><label>Password</label><input type="password" id="lp" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="lb" onclick="doLogin()">Login &rarr;</button>
    <div class="le" id="lerr">Invalid credentials!</div>
  </div>
</div>

<div id="dashboard">
  <header>
    <div class="hl">
      <div class="hlogo">&#128269;</div>
      <div><div class="ht">EDM Inspection</div><div class="hs">Admin Dashboard</div></div>
    </div>
    <div class="hr">
      <div class="dot"></div>
      <span style="font-size:12px;color:#64748b">Live</span>
      <button class="logbtn" onclick="logout()">Logout</button>
    </div>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><div class="sl">Total</div><div class="sv blue" id="sT">&#8212;</div></div>
      <div class="stat"><div class="sl">Today</div><div class="sv green" id="sTd">&#8212;</div></div>
      <div class="stat"><div class="sl">This Week</div><div class="sv amber" id="sW">&#8212;</div></div>
      <div class="stat"><div class="sl">EDM Officers</div><div class="sv purple" id="sE">&#8212;</div></div>
      <div class="stat"><div class="sl">Non-Compliant</div><div class="sv red" id="sNC">&#8212;</div></div>
    </div>
    <div class="filters">
      <input type="text" id="si" placeholder="Search name, ID, EDM..." oninput="filterData()">
      <select id="cf" onchange="filterData()">
        <option value="">All Compliance</option>
        <option>Compliant</option>
        <option>Partially Compliant</option>
        <option>Non-Compliant</option>
      </select>
      <select id="tf" onchange="filterData()">
        <option value="">All Types</option>
        <option>Routine</option>
        <option>Complaint-Based</option>
        <option>Surprise</option>
        <option>Follow-up</option>
        <option>Zero Transaction Blocked ID</option>
      </select>
      <button class="ebtn" onclick="exportAllPDF()">&#128196; Export All PDF</button>
    </div>
    <div class="tw">
      <div class="thead"><span>Inspections</span><small id="rc">Loading...</small></div>
      <table>
        <thead>
          <tr>
            <th>Esevai Centre</th>
            <th>EDM Officer</th>
            <th>Type</th>
            <th>Compliance</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="6"><div class="empty">Loading...</div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1100;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto">
  <div style="background:#1e293b;border:1px solid #334155;border-radius:18px;width:100%;max-width:720px;margin:auto">
    <div style="padding:16px 22px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#1e293b;border-radius:18px 18px 0 0;z-index:1">
      <h2 style="font-size:15px;font-weight:600;color:#fbbf24">&#9998; Edit Inspection Record</h2>
      <button onclick="closeEditModal()" style="background:transparent;border:none;color:#64748b;font-size:20px;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px">&#10005;</button>
    </div>
    <div style="padding:20px 22px" id="editModalBody"></div>
    <div style="padding:14px 22px;border-top:1px solid #334155;display:flex;gap:10px;position:sticky;bottom:0;background:#1e293b;border-radius:0 0 18px 18px">
      <button onclick="saveEdit()" id="saveEditBtn" style="flex:1;padding:12px;background:#15803d;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer">&#128190; Save Changes</button>
      <button onclick="closeEditModal()" style="padding:12px 20px;background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:9px;font-size:13px;cursor:pointer">Cancel</button>
    </div>
  </div>
</div>

<div id="modal">
  <div class="mc">
    <div class="mh"><h2>Inspection Details</h2><button class="xcb" onclick="closeModal()">&#10005;</button></div>
    <div class="mb" id="modalBody"></div>
    <div class="mf" style="flex-wrap:wrap;gap:8px">
      <button class="mpdf" id="mpdfBtn">&#128196; PDF</button>
      <button class="mpdf" id="mmobileBtn" style="background:#0ea5e9">&#128241; Mobile PDF</button>
      <button class="mpdf" id="mphotosBtn" style="background:#059669">&#128247; Photos</button>
      <button class="mclose" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBqBbMptc6YUylwnyiLK_NB0TJ7CTIVzf4",
  authDomain: "edm-inspection.firebaseapp.com",
  projectId: "edm-inspection",
  storageBucket: "edm-inspection.firebasestorage.app",
  messagingSenderId: "152254074581",
  appId: "1:152254074581:web:73c9d580456f14d2761c5c"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
window._deleteDoc = deleteDoc;
window._updateDoc = updateDoc;
window._doc = doc;
window._load=function(){
  window._db_ref = db;
  const q=query(collection(db,"inspections"),orderBy("timestamp","desc"));
  onSnapshot(q,snap=>{
    window._data=snap.docs.map(d=>({id:d.id,...d.data()}));
    updateStats();filterData();
  });
};
</script>

function getSig(edmName) {
  if(!edmName) return SIGNATURES["Sundaresan R"];
  for(const key of Object.keys(SIGNATURES)) {
    if(edmName.toLowerCase().includes(key.split(" ")[0].toLowerCase())) return SIGNATURES[key];
  }
  return SIGNATURES["Sundaresan R"];
}
const AU="admin",AP="admin123";
window._data=[];

function doLogin(){
  if(document.getElementById("lu").value===AU&&document.getElementById("lp").value===AP){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("dashboard").style.display="block";
    window._load();
  }else{document.getElementById("lerr").style.display="block";}
}
function logout(){
  document.getElementById("dashboard").style.display="none";
  document.getElementById("loginScreen").style.display="flex";
}
function updateStats(){
  const d=window._data;
  document.getElementById("sT").textContent=d.length;
  const today=new Date().toDateString();
  document.getElementById("sTd").textContent=d.filter(x=>x.timestamp?.toDate?.()?.toDateString()===today).length;
  const wa=Date.now()-7*864e5;
  document.getElementById("sW").textContent=d.filter(x=>x.timestamp?.toDate?.()?.getTime()>wa).length;
  document.getElementById("sE").textContent=new Set(d.map(x=>x.edmName)).size;
  document.getElementById("sNC").textContent=d.filter(x=>x.compliance==="Non-Compliant").length;
}
function filterData(){
  const q=document.getElementById("si").value.toLowerCase();
  const cf=document.getElementById("cf").value;
  const tf=document.getElementById("tf").value;
  const f=window._data.filter(d=>{
    const mq=!q||[d.operatorName,d.esevaiId,d.edmName,d.taluk].some(v=>(v||"").toLowerCase().includes(q));
    return (!cf||d.compliance===cf)&&(!tf||d.inspType===tf)&&mq;
  });
  renderTable(f);
}
function compBadge(c){
  if(c==="Compliant")return`<span class="bp bp-green">&#10003; ${c}</span>`;
  if(c==="Non-Compliant")return`<span class="bp bp-red">&#10007; ${c}</span>`;
  if(c==="Partially Compliant")return`<span class="bp bp-amber">~ ${c}</span>`;
  return`<span class="bp bp-blue">${c||"&#8212;"}</span>`;
}
function renderTable(data){
  const tb=document.getElementById("tbody");
  document.getElementById("rc").textContent=`${data.length} records`;
  if(!data.length){tb.innerHTML=`<tr><td colspan="6"><div class="empty">No records found</div></td></tr>`;return;}
  tb.innerHTML=data.map(d=>{
    const ts=d.timestamp?.toDate?.();
    const dt=ts?ts.toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"&#8212;";
    const init=(d.operatorName||"??").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
    return`<tr>
      <td><span class="av">${init}</span><span style="font-weight:500">${d.operatorName||"&#8212;"}</span><br><span style="font-size:10px;color:#64748b;margin-left:34px">${d.esevaiId||""}</span></td>
      <td><span class="bp bp-blue">${d.edmName||"&#8212;"}</span><br><span style="font-size:10px;color:#64748b">${d.edmMobile||""}</span></td>
      <td><span class="bp bp-purple">${d.inspType||"&#8212;"}</span></td>
      <td>${compBadge(d.compliance)}</td>
      <td style="color:#64748b;white-space:nowrap;font-size:11px">${dt}</td>
      <td>
        <button class="ab" onclick="viewDetail('${d.id}')">&#128065; View</button>
        <button class="ab" onclick="editRecord('${d.id}')" style="color:#fbbf24;border-color:#f59e0b">&#9998; Edit</button>
        <button class="pb" onclick="downloadPDF('${d.id}')">&#128196; PDF</button>
        <button class="ab" onclick="downloadPhotos('${d.id}')" style="color:#60a5fa;border-color:#3b82f6">&#128247; Photos</button>
        <button class="ab" onclick="deleteRecord('${d.id}')" style="color:#f87171;border-color:#ef4444">&#128465; Del</button>
      </td>
    </tr>`;
  }).join("");
}
function yn(v){
  if(v==="Yes")return`<span class="yn-yes">&#10003; Yes</span>`;
  if(v==="No")return`<span class="yn-no">&#10007; No</span>`;
  return"<span style=\"color:#64748b\">&#8212;</span>";
}

    </div>
    <div class="st">Inspector Details</div>
    <div class="dr"><span class="dl">EDM District</span><span class="dv">${d.edmDistrict||"&#8212;"}</span></div>
    <div class="dr"><span class="dl">EDM Name</span><span class="dv">${d.edmName||"&#8212;"}</span></div>

async function downloadPDF(id){
  const d=window._data.find(x=>x.id===id);
  if(!d)return;

  const sigSrc = getSig(d.edmName);
  const citizens = d.citizens||[d.citizen1,d.citizen2].filter(c=>c&&(c.name||c.phone));

  // Generate GPS QR code
  let qrDataURL = '';
  if(d.lat && d.lng){
    const mapsUrl = 'https://maps.google.com/?q='+d.lat+','+d.lng;
    // Method 1: QRCode library
    try{
      if(typeof QRCode!=='undefined' && QRCode.toDataURL){
        qrDataURL = await QRCode.toDataURL(mapsUrl,{width:200,margin:1,color:{dark:'#0a2463',light:'#ffffff'}});
      }
    }catch(e){console.warn('QR lib failed',e);}
    // Method 2: Fallback - QR API service
    if(!qrDataURL){
      try{
        const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=0a2463&data='+encodeURIComponent(mapsUrl);
        const resp = await fetch(qrUrl);
        const blob = await resp.blob();
        qrDataURL = await new Promise(r=>{
          const fr=new FileReader();
          fr.onload=()=>r(fr.result);
          fr.onerror=()=>r('');
          fr.readAsDataURL(blob);

  document.body.appendChild(container);

  try{
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pages = container.querySelectorAll('.pdf-page');

    for(let i=0;i<pages.length;i++){
      if(i>0) doc.addPage();
      const canvas = await html2canvas(pages[i],{
        scale:2, useCORS:true, allowTaint:true,

      });
      const imgData = canvas.toDataURL('image/jpeg',0.93);

    }

    doc.save(`EDM_Inspection_${d.esevaiId||'report'}_${d.inspDate||Date.now()}.pdf`);

  }finally{

}

  doc.setTextColor(0,0,0);
  y=38;

  // Helper functions
  const msec=(t)=>{
    if(y>270){doc.addPage();y=15;}
    doc.setFillColor(10,36,99);
    doc.rect(0,y-4,210,8,"F");
    doc.setTextColor(255,255,255);
    doc.setFontSize(9);doc.setFont(undefined,"bold");
    doc.text(t,105,y+1,{align:"center"});
    doc.setTextColor(0,0,0);
    y+=10;
  };
  const mrow=(l,v)=>{
    if(y>278){doc.addPage();y=15;}
    doc.setFillColor(248,250,252);
    doc.rect(0,y-4,210,8,"F");
    doc.setFontSize(8);doc.setFont(undefined,"bold");doc.setTextColor(71,85,105);
    doc.text(l,5,y);
    doc.setFont(undefined,"normal");doc.setTextColor(0,0,0);
    const lines=doc.splitTextToSize(String(v||"—"),100);
    doc.text(lines,105,y);
    y+=Math.max(lines.length*5,6)+1;
  };
  const myesno=(l,v)=>mrow(l,v==="Yes"?"Yes ✓":v==="No"?"No ✗":"—");

  msec("Inspector Details");
  mrow("EDM Name",d.edmName);
  mrow("District",d.edmDistrict);
  mrow("Mobile",d.edmMobile);

  msec("Centre Identification");
  mrow("Esevai ID",d.esevaiId);
  mrow("Operator Name",d.operatorName);
  mrow("Mobile",d.operatorMobile);
  mrow("Taluk",d.taluk);
  mrow("Date",d.inspDate);
  mrow("Type",d.inspType+(d.prevDate?" (Prev: "+d.prevDate+")":""));

  msec("Operations & Staffing");
  myesno("Working Hours Displayed",d.workHoursDisplayed);
  mrow("Working Hours",d.workHoursText);
  mrow("Citizens Present",d.citizenCount);
  myesno("Operator Present",d.operatorPresent);
  myesno("Identity Verified",d.identityVerified);

  msec("Infrastructure & Equipment");
  mrow("Internet Connectivity",d.internetObs);
  myesno("Printer & Scanner",d.printerAvailable);
  myesno("Premises Exclusive",d.premisesExclusive);

  msec("Citizen Transparency");
  myesno("Name Board",d.nameBoardDisplayed);
  myesno("Rate Card Visible",d.rateCardVisible);
  myesno("QR Code Working",d.qrCodeWorking);

  msec("Citizen Feedback");
  const citizens=d.citizens||[d.citizen1,d.citizen2].filter(c=>c&&(c.name||c.phone));
  if(citizens&&citizens.length>0){
    citizens.forEach((c,i)=>{
      if(!c)return;
      mrow(`Citizen ${i+1} Name`,c.name);
      mrow(`Citizen ${i+1} Phone`,c.phone);
      mrow(`Citizen ${i+1} Overcharging`,c.overcharge);
    });
  }

  msec("Summary");
  mrow("Compliance",d.compliance);
  mrow("Deficiencies",d.deficiencies);
  mrow("EDM Remarks",d.edmRemarks);
  mrow("GPS",`${d.lat||"—"}, ${d.lng||""}`);

  // Photos - 2 per row for mobile
  const photoList=[
    {key:"photo1_shop",label:"Shop / Centre"},
    {key:"photo2_ratechart",label:"Rate Chart"},
    {key:"photo3_computer",label:"Computer / Printer"}
  ];
  
  if(y>230){doc.addPage();y=15;}
  msec("Inspection Photos");
  
  let photoX=5, photoRowY=y;
  for(let i=0;i<photoList.length;i++){
    const ph=photoList[i];
    if(!d[ph.key])continue;
    if(photoX>110){photoX=5;photoRowY+=55;}
    if(photoRowY>240){doc.addPage();photoRowY=15;}
    try{
      const img=new Image();img.src=d[ph.key];
      await new Promise(r=>{img.onload=r;img.onerror=r;});
      const w=95,h=60;
      doc.addImage(d[ph.key],"JPEG",photoX,photoRowY,w,h);
      doc.setFontSize(7);doc.setTextColor(100,116,139);
      doc.text(ph.label,photoX+w/2,photoRowY+h+4,{align:"center"});
    }catch(e){}
    photoX+=100;
  }
  y=photoRowY+70;

  // Signature
  if(y>250){doc.addPage();y=15;}
  doc.setFillColor(248,250,252);
  doc.rect(0,y-4,210,35,"F");
  doc.setFontSize(8);doc.setFont(undefined,"normal");doc.setTextColor(80,80,80);
  doc.text("Certified by eDM:",5,y+2);
  try{
    const sigSrc=getSig(d.edmName);
    doc.addImage(sigSrc,"JPEG",5,y+5,45,18);
  }catch(e){}
  doc.setFontSize(9);doc.setFont(undefined,"bold");doc.setTextColor(0,0,0);
  doc.text(`${d.edmName||"—"}`,55,y+10);
  doc.setFontSize(8);doc.setFont(undefined,"normal");doc.setTextColor(80,80,80);
  doc.text(`${d.edmDistrict||"—"}`,55,y+16);
  doc.text(`Date: ${d.inspDate||new Date().toLocaleDateString("en-IN")}`,55,y+22);

  // Page numbers
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    doc.setFontSize(7);doc.setTextColor(150,150,150);
    doc.text(`Page ${i} of ${pages}`,196,290,{align:"right"});
  }

  doc.save(`Mobile_Inspection_${d.esevaiId||"report"}_${d.inspDate||Date.now()}.pdf`);
}

let _editId = null;

function editRecord(id){
  const d = window._data.find(x => x.id === id);
  if(!d) return;
  _editId = id;

  const inp=(id,label,val,type='text')=>`
    <div style="margin-bottom:12px">
      <label style="display:block;font-size:12px;color:#94a3b8;margin-bottom:5px;font-weight:600">${label}</label>
      <input type="${type}" id="e_${id}" value="${(val||'').toString().replace(/"/g,'&quot;')}" style="width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;font-size:13px;padding:10px 12px;outline:none">
    </div>`;

  const txtarea=(id,label,val)=>`
    <div style="margin-bottom:12px">
      <label style="display:block;font-size:12px;color:#94a3b8;margin-bottom:5px;font-weight:600">${label}</label>
      <textarea id="e_${id}" style="width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;font-size:13px;padding:10px 12px;outline:none;min-height:70px;resize:vertical">${val||''}</textarea>
    </div>`;

  const sel=(id,label,val,options)=>`
    <div style="margin-bottom:12px">
      <label style="display:block;font-size:12px;color:#94a3b8;margin-bottom:5px;font-weight:600">${label}</label>
      <select id="e_${id}" style="width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;font-size:13px;padding:10px 12px;outline:none">
        ${options.map(o=>`<option value="${o}" ${o===val?'selected':''}>${o||'-- Select --'}</option>`).join('')}
      </select>
    </div>`;

  const ynSel=(id,label,val)=>sel(id,label,val,['','Yes','No']);

  const secT=(t)=>`<div style="font-size:11px;font-weight:700;color:#fbbf24;text-transform:uppercase;letter-spacing:0.05em;margin:18px 0 10px;padding-bottom:5px;border-bottom:1px solid #334155">${t}</div>`;

  const row2=(a,b)=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${a}${b}</div>`;

  const citizens = d.citizens||[d.citizen1,d.citizen2].filter(c=>c&&(c.name||c.phone));
  const citizenFields = citizens.map((c,i)=>`
    ${secT('Citizen '+(i+1))}
    ${row2(inp('cz'+i+'_name','Name',c.name),inp('cz'+i+'_phone','Phone',c.phone,'tel'))}
    ${ynSel('cz'+i+'_over','Overcharging',c.overcharge)}
  `).join('');

  document.getElementById('editModalBody').innerHTML = `
    ${secT('Inspection Details')}
    ${row2(inp('inspDate','Date of Inspection',d.inspDate,'date'),
      sel('inspType','Type of Inspection',d.inspType,['','Routine','Complaint-Based','Surprise','Follow-up','Zero Transaction Blocked ID']))}
    ${d.inspType==='Follow-up'||d.prevDate?inp('prevDate','Previous Date',d.prevDate,'date'):''}

    ${secT('EDM Details')}
    ${row2(inp('edmName','EDM Name',d.edmName),inp('edmMobile','EDM Mobile',d.edmMobile,'tel'))}
    ${inp('edmDistrict','EDM District',d.edmDistrict)}

    ${secT('Centre Details')}
    ${row2(inp('esevaiId','Esevai ID',d.esevaiId),inp('operatorName','Operator Name',d.operatorName))}
    ${row2(inp('operatorMobile','Operator Mobile',d.operatorMobile,'tel'),inp('taluk','Taluk',d.taluk))}
    ${txtarea('operatorAddress','Centre Address',d.operatorAddress)}
    ${txtarea('inspectionAddress','Inspection Address (if different)',d.inspectionAddress)}

    ${secT('Operations & Staffing')}
    ${row2(ynSel('workHoursDisplayed','Working Hours Displayed',d.workHoursDisplayed),inp('workHoursText','Working Hours',d.workHoursText))}
    ${row2(inp('citizenCount','Citizens Present',d.citizenCount,'number'),ynSel('operatorPresent','Operator Present',d.operatorPresent))}
    ${ynSel('identityVerified','Identity Verified',d.identityVerified)}

    ${secT('Infrastructure')}
    ${row2(sel('internetObs','Internet Connectivity',d.internetObs,['','Broadband','Mobile Data','Dongle']),ynSel('printerAvailable','Printer & Scanner',d.printerAvailable))}
    ${ynSel('premisesExclusive','Premises Exclusive',d.premisesExclusive)}

    ${secT('Transparency & Display')}
    ${row2(ynSel('nameBoardDisplayed','Name Board Displayed',d.nameBoardDisplayed),ynSel('rateCardVisible','Rate Card Visible',d.rateCardVisible))}
    ${row2(ynSel('qrCodeWorking','QR Code Working',d.qrCodeWorking),ynSel('overchargeDisclaimer','Overcharging Disclaimer',d.overchargeDisclaimer))}
    ${inp('transactionCount','Monthly Transaction Count',d.transactionCount,'number')}

    ${citizenFields}

    ${secT('Summary & Remarks')}
    ${sel('compliance','Overall Compliance',d.compliance,['','Compliant','Partially Compliant','Non-Compliant'])}
    ${txtarea('deficiencies','Key Deficiencies',d.deficiencies)}
    ${txtarea('edmRemarks','EDM Remarks',d.edmRemarks)}

    ${secT('GPS')}
    ${row2(inp('lat','Latitude',d.lat),inp('lng','Longitude',d.lng))}
    ${inp('gpsPlace','Location Name',d.gpsPlace)}
  `;
  document.getElementById('editModal').style.display = 'flex';
}

function closeEditModal(){
  document.getElementById('editModal').style.display = 'none';
  _editId = null;
}

async function saveEdit(){
  if(!_editId) return;
  const d = window._data.find(x => x.id === _editId);
  if(!d) return;

  const gv=(id)=>{const el=document.getElementById('e_'+id);return el?el.value:undefined;};

  const btn = document.getElementById('saveEditBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try{
    const citizens = d.citizens||[d.citizen1,d.citizen2].filter(c=>c&&(c.name||c.phone));
    const updatedCitizens = citizens.map((c,i)=>({
      name: gv('cz'+i+'_name')||'',
      phone: gv('cz'+i+'_phone')||'',
      overcharge: gv('cz'+i+'_over')||''
    }));

    const updates = {
      inspDate: gv('inspDate')||'',
      inspType: gv('inspType')||'',
      edmName: gv('edmName')||'',
      edmMobile: gv('edmMobile')||'',
      edmDistrict: gv('edmDistrict')||'',
      esevaiId: gv('esevaiId')||'',
      operatorName: gv('operatorName')||'',
      operatorMobile: gv('operatorMobile')||'',
      taluk: gv('taluk')||'',
      operatorAddress: gv('operatorAddress')||'',
      inspectionAddress: gv('inspectionAddress')||'',
      workHoursDisplayed: gv('workHoursDisplayed')||'',
      workHoursText: gv('workHoursText')||'',
      citizenCount: gv('citizenCount')||'',
      operatorPresent: gv('operatorPresent')||'',
      identityVerified: gv('identityVerified')||'',
      internetObs: gv('internetObs')||'',
      printerAvailable: gv('printerAvailable')||'',
      premisesExclusive: gv('premisesExclusive')||'',
      nameBoardDisplayed: gv('nameBoardDisplayed')||'',
      rateCardVisible: gv('rateCardVisible')||'',
      qrCodeWorking: gv('qrCodeWorking')||'',
      overchargeDisclaimer: gv('overchargeDisclaimer')||'',
      transactionCount: gv('transactionCount')||'',
      compliance: gv('compliance')||'',
      deficiencies: gv('deficiencies')||'',
      edmRemarks: gv('edmRemarks')||'',
      lat: gv('lat')||'',
      lng: gv('lng')||'',
      gpsPlace: gv('gpsPlace')||'',
      citizens: updatedCitizens,
      lastEdited: new Date().toISOString()
    };
    if(gv('prevDate')!==undefined) updates.prevDate = gv('prevDate')||null;

    await window._updateDoc(window._doc(window._db_ref,'inspections',_editId), updates);

    // Update local data immediately
    Object.assign(d, updates);
    updateStats();
    filterData();
    closeEditModal();
    alert('&#10003; Record updated successfully!'.replace('&#10003;','\u2713'));
  }catch(err){
    alert('Error: '+err.message);
  }finally{
    btn.disabled = false;
    btn.innerHTML = '&#128190; Save Changes';
  }
}

async function deleteRecord(id){
  if(!confirm('இந்த record-ஐ permanently delete பண்ணவா? Photos எல்லாம் delete ஆகும்!')) return;
  try{
    await window._deleteDoc(window._doc(window._db_ref, 'inspections', id));
    window._data = window._data.filter(x => x.id !== id);
    updateStats();
    filterData();
    closeModal();
    alert('Record deleted successfully!');
  }catch(err){
    alert('Error: ' + err.message);
  }
}

// Store db ref
window._db_ref = null;

function downloadPhotos(id){
  const d = window._data.find(x => x.id === id);
  if(!d) return;
  
  const photos = [
    {key:'photo1_shop', label:'Shop_Centre'},
    {key:'photo2_ratechart', label:'Rate_Chart'},
    {key:'photo3_computer', label:'Computer_Printer'},
    {key:'photo4_letter', label:'Letter'}
  ].filter(p => d[p.key]);

  if(!photos.length){ alert('No photos found!'); return; }

  // Create photo viewer modal
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:2000;display:flex;flex-direction:column;align-items:center;padding:20px;overflow-y:auto';
  
  const closeBtn = document.createElement('button');
  closeBtn.innerHTML = '✕ Close';
  closeBtn.style.cssText = 'position:fixed;top:15px;right:15px;background:#ef4444;color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:600;z-index:2001';
  closeBtn.onclick = () => overlay.remove();
  overlay.appendChild(closeBtn);

  const title = document.createElement('div');
  title.style.cssText = 'color:#fff;font-size:16px;font-weight:700;margin-bottom:20px;margin-top:10px';
  title.textContent = `Photos — ${d.operatorName||'—'} (${d.esevaiId||''})`;
  overlay.appendChild(title);

  photos.forEach((p,i) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'margin-bottom:24px;text-align:center;width:100%;max-width:500px';
    
    const label = document.createElement('div');
    label.style.cssText = 'color:#94a3b8;font-size:12px;margin-bottom:8px;font-weight:600';
    label.textContent = `Photo ${i+1} – ${p.label.replace(/_/g,' ')}`;
    
    const img = document.createElement('img');
    img.src = d[p.key];
    img.style.cssText = 'width:100%;border-radius:10px;border:2px solid #334155';
    
    const dlBtn = document.createElement('a');
    dlBtn.href = d[p.key];
    dlBtn.download = `${d.esevaiId||'photo'}_${p.label}_${d.inspDate||Date.now()}.jpg`;
    dlBtn.style.cssText = 'display:inline-block;margin-top:8px;background:#3b82f6;color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none';
    dlBtn.textContent = `⬇ Download Photo ${i+1}`;
    
    wrap.appendChild(label);
    wrap.appendChild(img);
    wrap.appendChild(dlBtn);
    overlay.appendChild(wrap);
  });

  document.body.appendChild(overlay);
}

async function exportAllPDF(){
  const data=window._data;
  if(!data.length){alert("No data");return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF("landscape");
  doc.setFillColor(15,23,42);doc.rect(0,0,297,28,"F");
  doc.setTextColor(255,255,255);doc.setFontSize(14);doc.setFont(undefined,"bold");
  doc.text("EDM INSPECTIONS - ALL RECORDS",148,14,{align:"center"});
  doc.setFontSize(8);doc.setFont(undefined,"normal");
  doc.text(`Generated: ${new Date().toLocaleString("en-IN")} | Total: ${data.length}`,148,22,{align:"center"});
  doc.setTextColor(0,0,0);
  const hdrs=["#","Date","Esevai ID","Operator","EDM Name","Taluk","Type","Compliance","GPS"];
  const cw=[8,22,28,32,26,22,28,28,28];
  let x=8,y=36;
  doc.setFontSize(7);doc.setFont(undefined,"bold");doc.setFillColor(220,225,240);doc.rect(8,y-5,280,9,"F");
  hdrs.forEach((h,i)=>{doc.text(h,x+1,y);x+=cw[i];});y+=6;doc.setFont(undefined,"normal");
  data.forEach((d,i)=>{
    if(y>195){doc.addPage("","landscape");y=18;}
    x=8;
    const ts=d.timestamp?.toDate?.();
    const row=[String(i+1),d.inspDate||"—",d.esevaiId||"",d.operatorName||"",d.edmName||"",d.taluk||"",d.inspType||"",d.compliance||"",`${d.lat||""},${d.lng||""}`];
    if(i%2===0){doc.setFillColor(248,249,252);doc.rect(8,y-5,280,8,"F");}
    row.forEach((v,j)=>{doc.text(String(v).slice(0,14),x+1,y);x+=cw[j];});y+=9;
  });
  doc.save(`EDM_All_Inspections_${Date.now()}.pdf`);
}
