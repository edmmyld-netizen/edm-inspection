<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDM Admin Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#1e3a5f,#0f172a 70%)}
.lc{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:40px;width:100%;max-width:380px}
.ll{font-size:36px;text-align:center;margin-bottom:8px}
.lt{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
.ls{text-align:center;color:#64748b;font-size:13px;margin-bottom:28px}
.lf{margin-bottom:16px}
.lf label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
.lf input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#f1f5f9;font-size:15px;padding:12px 14px;outline:none}
.lf input:focus{border-color:#3b82f6}
.lb{width:100%;padding:14px;background:#3b82f6;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.le{color:#ef4444;font-size:13px;text-align:center;margin-top:10px;display:none}
#dashboard{display:none}
header{background:#1e293b;border-bottom:1px solid #334155;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hl{display:flex;align-items:center;gap:12px}
.hlogo{width:34px;height:34px;background:#3b82f6;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.ht{font-size:16px;font-weight:700}
.hs{font-size:11px;color:#64748b}
.hr{display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.logbtn{background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
main{padding:20px;max-width:1300px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px 18px}
.sl{font-size:11px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
.sv{font-size:26px;font-weight:700}
.blue{color:#60a5fa}.green{color:#4ade80}.amber{color:#fbbf24}.purple{color:#c084fc}.red{color:#f87171}
.filters{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filters input,.filters select{background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;font-size:13px;padding:8px 11px;outline:none}
.filters input{flex:1;min-width:180px}
.ebtn{background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tw{background:#1e293b;border:1px solid #334155;border-radius:14px;overflow:hidden}
.thead{padding:14px 18px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between}
.thead span{font-size:14px;font-weight:600}
.thead small{font-size:12px;color:#64748b}
table{width:100%;border-collapse:collapse}
thead tr{background:#0f172a}
th{padding:11px 14px;text-align:left;font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid #334155}
td{padding:10px 14px;font-size:12px;border-bottom:1px solid #1a2535;vertical-align:middle}
tr:hover td{background:#1a2535}
tr:last-child td{border-bottom:none}
.av{width:28px;height:28px;border-radius:6px;background:#1d4ed8;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#bfdbfe;margin-right:6px;vertical-align:middle}
.bp{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px}
.bp-blue{background:#1e3a5f;color:#60a5fa}
.bp-green{background:#14532d;color:#4ade80}
.bp-amber{background:#451a03;color:#fbbf24}
.bp-red{background:#450a0a;color:#f87171}
.bp-purple{background:#3b0764;color:#c084fc}
.ab{background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer;margin-right:3px}
.ab:hover{background:#1e3a5f;color:#60a5fa;border-color:#3b82f6}
.pb{background:#7c3aed22;border:1px solid #7c3aed55;color:#a78bfa;border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer}
.pb:hover{background:#7c3aed;color:#fff}
.empty{text-align:center;padding:50px;color:#475569}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
#modal.open{display:flex}
.mc{background:#1e293b;border:1px solid #334155;border-radius:18px;width:100%;max-width:640px;margin:auto}
.mh{padding:16px 22px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#1e293b;border-radius:18px 18px 0 0;z-index:1}
.mh h2{font-size:15px;font-weight:600}
.xcb{background:transparent;border:none;color:#64748b;font-size:20px;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.xcb:hover{background:#334155;color:#f1f5f9}
.mb{padding:20px 22px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.pt{border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:#0f172a;border:1px solid #334155}
.pt img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.pt .np{display:flex;align-items:center;justify-content:center;height:100%;color:#475569;font-size:20px}
.pc{font-size:10px;color:#64748b;text-align:center;margin-top:4px}
.dr{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid #1a2535}
.dr:last-child{border-bottom:none}
.dl{font-size:11px;color:#64748b;font-weight:600;min-width:130px}
.dv{font-size:12px;color:#f1f5f9;text-align:right;word-break:break-all;max-width:280px}
.st{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid #334155}
.mf{padding:14px 22px;border-top:1px solid #334155;display:flex;gap:10px}
.mpdf{flex:1;padding:10px;background:#7c3aed;color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.mclose{padding:10px 16px;background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:9px;font-size:13px;cursor:pointer}
.yn-yes{color:#22c55e;font-weight:600}
.yn-no{color:#ef4444;font-weight:600}
@media(max-width:700px){th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}main{padding:12px}}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="lc">
    <div class="ll">🔐</div>
    <div class="lt">Admin Login</div>
    <div class="ls">EDM Inspection Dashboard</div>
    <div class="lf"><label>Username</label><input type="text" id="lu" value="admin"></div>
    <div class="lf"><label>Password</label><input type="password" id="lp" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="lb" onclick="doLogin()">Login →</button>
    <div class="le" id="lerr">தவறான credentials!</div>
  </div>
</div>

<div id="dashboard">
  <header>
    <div class="hl">
      <div class="hlogo">🔍</div>
      <div><div class="ht">EDM Inspection</div><div class="hs">Admin Dashboard</div></div>
    </div>
    <div class="hr">
      <div class="dot"></div>
      <span style="font-size:12px;color:#64748b">Live</span>
      <button class="logbtn" onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="stats">
      <div class="stat"><div class="sl">Total</div><div class="sv blue" id="sT">—</div></div>
      <div class="stat"><div class="sl">Today</div><div class="sv green" id="sTd">—</div></div>
      <div class="stat"><div class="sl">This Week</div><div class="sv amber" id="sW">—</div></div>
      <div class="stat"><div class="sl">EDM Officers</div><div class="sv purple" id="sE">—</div></div>
      <div class="stat"><div class="sl">Non-Compliant</div><div class="sv red" id="sNC">—</div></div>
    </div>

    <div class="filters">
      <input type="text" id="si" placeholder="🔍 Search name, ID, EDM, taluk..." oninput="filterData()">
      <select id="cf" onchange="filterData()">
        <option value="">All Compliance</option>
        <option>Compliant</option>
        <option>Partially Compliant</option>
        <option>Non-Compliant</option>
      </select>
      <select id="tf" onchange="filterData()">
        <option value="">All Types</option>
        <option>Routine</option>
        <option>Complaint-Based</option>
        <option>Surprise</option>
        <option>Follow-up</option>
        <option>Zero Transaction Blocked ID</option>
      </select>
      <button class="ebtn" onclick="exportAllPDF()">📄 Export All PDF</button>
    </div>

    <div class="tw">
      <div class="thead"><span>Inspections</span><small id="rc">Loading...</small></div>
      <table>
        <thead>
          <tr>
            <th>Esevai Centre</th>
            <th>EDM Officer</th>
            <th>Type</th>
            <th>Compliance</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="6"><div class="empty">⏳ Loading...</div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div id="modal">
  <div class="mc">
    <div class="mh"><h2>Inspection Details</h2><button class="xcb" onclick="closeModal()">✕</button></div>
    <div class="mb" id="modalBody"></div>
    <div class="mf">
      <button class="mpdf" id="mpdfBtn">📄 Download PDF</button>
      <button class="mclose" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBqBbMptc6YUylwnyiLK_NB0TJ7CTIVzf4",
  authDomain: "edm-inspection.firebaseapp.com",
  projectId: "edm-inspection",
  storageBucket: "edm-inspection.firebasestorage.app",
  messagingSenderId: "152254074581",
  appId: "1:152254074581:web:73c9d580456f14d2761c5c"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
window._load=function(){
  const q=query(collection(db,'inspections'),orderBy('timestamp','desc'));
  onSnapshot(q,snap=>{
    window._data=snap.docs.map(d=>({id:d.id,...d.data()}));
    updateStats();filterData();
  });
};
</script>

<script>
const AU='admin',AP='admin123';
window._data=[];

function doLogin(){
  if(document.getElementById('lu').value===AU&&document.getElementById('lp').value===AP){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('dashboard').style.display='block';
    window._load();
  }else{document.getElementById('lerr').style.display='block';}
}
function logout(){
  document.getElementById('dashboard').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}

function updateStats(){
  const d=window._data;
  document.getElementById('sT').textContent=d.length;
  const today=new Date().toDateString();
  document.getElementById('sTd').textContent=d.filter(x=>x.timestamp?.toDate?.()?.toDateString()===today).length;
  const wa=Date.now()-7*864e5;
  document.getElementById('sW').textContent=d.filter(x=>x.timestamp?.toDate?.()?.getTime()>wa).length;
  document.getElementById('sE').textContent=new Set(d.map(x=>x.edmName)).size;
  document.getElementById('sNC').textContent=d.filter(x=>x.compliance==='Non-Compliant').length;
}

function filterData(){
  const q=document.getElementById('si').value.toLowerCase();
  const cf=document.getElementById('cf').value;
  const tf=document.getElementById('tf').value;
  const f=window._data.filter(d=>{
    const mq=!q||[d.operatorName,d.esevaiId,d.edmName,d.taluk,d.gpsPlace].some(v=>(v||'').toLowerCase().includes(q));
    const mc=!cf||d.compliance===cf;
    const mt=!tf||d.inspType===tf;
    return mq&&mc&&mt;
  });
  renderTable(f);
}

function compBadge(c){
  if(c==='Compliant')return`<span class="bp bp-green">✓ ${c}</span>`;
  if(c==='Non-Compliant')return`<span class="bp bp-red">✗ ${c}</span>`;
  if(c==='Partially Compliant')return`<span class="bp bp-amber">~ ${c}</span>`;
  return`<span class="bp bp-blue">${c||'—'}</span>`;
}
function typeBadge(t){return`<span class="bp bp-purple">${t||'—'}</span>`;}

function renderTable(data){
  const tb=document.getElementById('tbody');
  document.getElementById('rc').textContent=`${data.length} records`;
  if(!data.length){tb.innerHTML=`<tr><td colspan="6"><div class="empty">📋 No records</div></td></tr>`;return;}
  tb.innerHTML=data.map(d=>{
    const ts=d.timestamp?.toDate?.();
    const dt=ts?ts.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
    const init=(d.operatorName||'??').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    return`<tr>
      <td><span class="av">${init}</span><span style="font-weight:500">${d.operatorName||'—'}</span><br><span style="font-size:10px;color:#64748b;margin-left:34px">${d.esevaiId||''}</span></td>
      <td><span class="bp bp-blue">${d.edmName||'—'}</span><br><span style="font-size:10px;color:#64748b">${d.edmMobile||''}</span></td>
      <td>${typeBadge(d.inspType)}</td>
      <td>${compBadge(d.compliance)}</td>
      <td style="color:#64748b;white-space:nowrap;font-size:11px">${dt}</td>
      <td>
        <button class="ab" onclick="viewDetail('${d.id}')">👁 View</button>
        <button class="pb" onclick="downloadPDF('${d.id}')">📄 PDF</button>
      </td>
    </tr>`;
  }).join('');
}

function yn(v){
  if(v==='Yes')return`<span class="yn-yes">✓ Yes</span>`;
  if(v==='No')return`<span class="yn-no">✗ No</span>`;
  return'<span style="color:#64748b">—</span>';
}

function viewDetail(id){
  const d=window._data.find(x=>x.id===id);
  if(!d)return;
  const ts=d.timestamp?.toDate?.();
  const dt=ts?ts.toLocaleString('en-IN'):'—';

  document.getElementById('modalBody').innerHTML=`
    <div class="st">📷 Inspection Photos</div>
    <div class="pg">
      <div><div class="pt">${d.photo1_shop?`<img src="${d.photo1_shop}" onclick="window.open(this.src)">`:`<div class="np">🏪</div>`}</div><div class="pc">1. Shop</div></div>
      <div><div class="pt">${d.photo2_ratechart?`<img src="${d.photo2_ratechart}" onclick="window.open(this.src)">`:`<div class="np">📋</div>`}</div><div class="pc">2. Rate Chart</div></div>
      <div><div class="pt">${d.photo3_computer?`<img src="${d.photo3_computer}" onclick="window.open(this.src)">`:`<div class="np">💻</div>`}</div><div class="pc">3. Computer</div></div>
    </div>
    <div class="st">📋 PART A – Identification</div>
    <div class="dr"><span class="dl">Date</span><span class="dv">${d.inspDate||dt}</span></div>
    <div class="dr"><span class="dl">Type</span><span class="dv">${d.inspType||'—'}${d.prevDate?' (Prev: '+d.prevDate+')':''}</span></div>
    <div class="dr"><span class="dl">EDM District</span><span class="dv">${d.edmDistrict||'—'}</span></div>
    <div class="dr"><span class="dl">EDM Name</span><span class="dv">${d.edmName||'—'}</span></div>
    <div class="dr"><span class="dl">EDM Mobile</span><span class="dv">${d.edmMobile||'—'}</span></div>
    <div class="dr"><span class="dl">Esevai ID</span><span class="dv">${d.esevaiId||'—'}</span></div>
    <div class="dr"><span class="dl">Operator</span><span class="dv">${d.operatorName||'—'}</span></div>
    <div class="dr"><span class="dl">Mobile</span><span class="dv">${d.operatorMobile||'—'}</span></div>
    <div class="dr"><span class="dl">Taluk</span><span class="dv">${d.taluk||'—'}</span></div>
    <div class="dr"><span class="dl">Address</span><span class="dv">${d.operatorAddress||'—'}</span></div>
    <div class="st">🏪 Section 1 – Operations</div>
    <div class="dr"><span class="dl">Working Hours Displayed</span><span class="dv">${yn(d.workHoursDisplayed)}</span></div>
    <div class="dr"><span class="dl">Working Hours</span><span class="dv">${d.workHoursText||'—'}</span></div>
    <div class="dr"><span class="dl">Citizens Present</span><span class="dv">${d.citizenCount||'—'}</span></div>
    <div class="dr"><span class="dl">Operator Present</span><span class="dv">${yn(d.operatorPresent)}</span></div>
    <div class="dr"><span class="dl">Identity Verified</span><span class="dv">${yn(d.identityVerified)}</span></div>
    <div class="st">💻 Section 2 – Infrastructure</div>
    <div class="dr"><span class="dl">Internet Observation</span><span class="dv">${d.internetObs||'—'}</span></div>
    <div class="dr"><span class="dl">Printer & Scanner</span><span class="dv">${yn(d.printerAvailable)}</span></div>
    <div class="dr"><span class="dl">Premises Exclusive</span><span class="dv">${yn(d.premisesExclusive)}</span></div>
    <div class="st">📌 Section 3 – Display</div>
    <div class="dr"><span class="dl">Name Board</span><span class="dv">${yn(d.nameBoardDisplayed)}</span></div>
    <div class="dr"><span class="dl">Rate Card Visible</span><span class="dv">${yn(d.rateCardVisible)}</span></div>
    <div class="dr"><span class="dl">QR Code Working</span><span class="dv">${yn(d.qrCodeWorking)}</span></div>
    <div class="st">👥 Section 5 – Citizen Feedback</div>
    <div class="dr"><span class="dl">Citizen 1 Name</span><span class="dv">${d.citizen1?.name||'—'}</span></div>
    <div class="dr"><span class="dl">Citizen 1 Phone</span><span class="dv">${d.citizen1?.phone||'—'}</span></div>
    <div class="dr"><span class="dl">Citizen 1 Overcharging</span><span class="dv">${d.citizen1?.overcharge||'—'}</span></div>
    <div class="dr"><span class="dl">Citizen 1 Rating</span><span class="dv">${d.citizen1?.rating||'—'}/10</span></div>
    <div class="dr"><span class="dl">Citizen 2 Name</span><span class="dv">${d.citizen2?.name||'—'}</span></div>
    <div class="dr"><span class="dl">Citizen 2 Phone</span><span class="dv">${d.citizen2?.phone||'—'}</span></div>
    <div class="dr"><span class="dl">Citizen 2 Overcharging</span><span class="dv">${d.citizen2?.overcharge||'—'}</span></div>
    <div class="dr"><span class="dl">Citizen 2 Rating</span><span class="dv">${d.citizen2?.rating||'—'}/10</span></div>
    <div class="st">📊 PART B – Summary</div>
    <div class="dr"><span class="dl">Overall Compliance</span><span class="dv">${compBadge(d.compliance)}</span></div>
    <div class="dr"><span class="dl">Key Deficiencies</span><span class="dv">${d.deficiencies||'—'}</span></div>
    <div class="dr"><span class="dl">GPS Location</span><span class="dv">${d.gpsPlace||'—'}<br><a href="https://maps.google.com?q=${d.lat},${d.lng}" target="_blank" style="color:#60a5fa;font-size:11px">${d.lat}, ${d.lng}</a></span></div>
    <div class="dr"><span class="dl">Submitted At</span><span class="dv">${dt}</span></div>
  `;
  document.getElementById('mpdfBtn').onclick=()=>downloadPDF(id);
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

function compBadge(c){
  if(c==='Compliant')return`<span class="bp bp-green">✓ ${c}</span>`;
  if(c==='Non-Compliant')return`<span class="bp bp-red">✗ ${c}</span>`;
  if(c==='Partially Compliant')return`<span class="bp bp-amber">~ ${c}</span>`;
  return`<span class="bp bp-blue">${c||'—'}</span>`;
}
function typeBadge(t){return`<span class="bp bp-purple">${t||'—'}</span>`;}

async function downloadPDF(id){
  const d=window._data.find(x=>x.id===id);
  if(!d)return;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();

  // Header
  doc.setFillColor(15,23,42);
  doc.rect(0,0,210,42,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(16);doc.setFont(undefined,'bold');
  doc.text('Government of Tamil Nadu | TNeGA',105,12,{align:'center'});
  doc.setFontSize(13);
  doc.text('e-Sevai Centre Inspection Report',105,22,{align:'center'});
  doc.setFontSize(9);doc.setFont(undefined,'normal');
  doc.text(`Generated: ${new Date().toLocaleString('en-IN')} | ID: ${id.slice(0,12)}`,105,32,{align:'center'});

  doc.setTextColor(0,0,0);
  let y=52;

  const sec=(t)=>{
    if(y>260){doc.addPage();y=20;}
    doc.setFontSize(10);doc.setFont(undefined,'bold');doc.setTextColor(30,58,138);
    doc.text(t,14,y);y+=4;
    doc.setLineWidth(0.3);doc.setDrawColor(30,58,138);doc.line(14,y,196,y);y+=6;
    doc.setTextColor(0,0,0);
  };
  const row=(l,v)=>{
    if(y>275){doc.addPage();y=20;}
    doc.setFontSize(8);doc.setFont(undefined,'bold');doc.setTextColor(100,116,139);
    doc.text(l,14,y);
    doc.setFont(undefined,'normal');doc.setTextColor(0,0,0);
    const lines=doc.splitTextToSize(String(v||'—'),105);
    doc.text(lines,95,y);
    y+=lines.length*5+2;
  };
  const yesno=(l,v)=>row(l,v==='Yes'?'Yes ✓':v==='No'?'No ✗':'—');

  sec('PART A – Centre Identification');
  row('Date of Inspection',d.inspDate||'—');
  row('Type of Inspection',d.inspType+(d.prevDate?' (Prev: '+d.prevDate+')':''));
  row('EDM District',d.edmDistrict);row('EDM Name',d.edmName);row('EDM Mobile',d.edmMobile);
  row('Esevai ID',d.esevaiId);row('Operator Name',d.operatorName);row('Mobile',d.operatorMobile);
  row('Taluk',d.taluk);row('Address',d.operatorAddress);y+=3;

  sec('Section 1 – Operations & Staffing');
  yesno('Working Hours Displayed',d.workHoursDisplayed);
  row('Working Hours',d.workHoursText);row('Citizens Present',d.citizenCount);
  yesno('Operator Present',d.operatorPresent);yesno('Identity Verified',d.identityVerified);y+=3;

  sec('Section 2 – Infrastructure & Equipment');
  row('Internet Connectivity',d.internetObs);
  yesno('Printer & Scanner',d.printerAvailable);yesno('Premises Exclusive',d.premisesExclusive);y+=3;

  sec('Section 3 – Citizen Transparency');
  yesno('Name Board Displayed',d.nameBoardDisplayed);
  yesno('Rate Card Visible',d.rateCardVisible);yesno('QR Code Working',d.qrCodeWorking);y+=3;

  sec('Section 5 – Citizen Feedback');
  row('Citizen 1 Name',d.citizen1?.name);row('Citizen 1 Phone',d.citizen1?.phone);
  row('Citizen 1 Overcharging',d.citizen1?.overcharge);row('Citizen 1 Rating',`${d.citizen1?.rating||'—'}/10`);
  row('Citizen 2 Name',d.citizen2?.name);row('Citizen 2 Phone',d.citizen2?.phone);
  row('Citizen 2 Overcharging',d.citizen2?.overcharge);row('Citizen 2 Rating',`${d.citizen2?.rating||'—'}/10`);y+=3;

  sec('PART B – eDM Summary');
  row('Overall Compliance',d.compliance);row('Key Deficiencies',d.deficiencies);
  row('GPS Location',`${d.gpsPlace||'—'} (${d.lat||'—'}, ${d.lng||'—'})`);y+=3;

  // Photos
  const photoList=[
    {key:'photo1_shop',label:'Photo 1 – Shop / Centre'},
    {key:'photo2_ratechart',label:'Photo 2 – Rate Chart'},
    {key:'photo3_computer',label:'Photo 3 – Computer / Printer'}
  ];
  for(const ph of photoList){
    if(!d[ph.key])continue;
    if(y>220){doc.addPage();y=20;}
    sec(ph.label);
    try{
      const img=new Image();img.src=d[ph.key];
      await new Promise(r=>{img.onload=r;img.onerror=r;});
      const mW=160,mH=90;
      const ratio=Math.min(mW/img.width,mH/img.height);
      doc.addImage(d[ph.key],'JPEG',14,y,img.width*ratio,img.height*ratio);
      y+=img.height*ratio+10;
    }catch(e){}
  }

  // Signature
  doc.addPage();
  y=20;
  sec('Certification by eDM');
  doc.setFontSize(9);doc.setFont(undefined,'normal');doc.setTextColor(80,80,80);
  doc.text('I certify that this inspection was conducted independently, without bias,',14,y);y+=5;
  doc.text('and all observations are factually accurate. Photo evidence is attached.',14,y);y+=15;

  try{
    const sigImg=new Image();
    sigImg.src='edm_signature.png';
    await new Promise(r=>{sigImg.onload=r;sigImg.onerror=r;});
    doc.addImage(sigImg,'PNG',14,y,50,20);
    y+=25;
  }catch(e){}

  doc.setFontSize(9);doc.setFont(undefined,'bold');doc.setTextColor(0,0,0);
  doc.text(`eDM Name: ${d.edmName||'—'}`,14,y);y+=6;
  doc.text(`District: ${d.edmDistrict||'—'}`,14,y);y+=6;
  doc.text(`Date: ${d.inspDate||new Date().toLocaleDateString('en-IN')}`,14,y);

  // Footer
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    doc.setFontSize(8);doc.setTextColor(150,150,150);
    doc.text('TNeGA | e-Sevai Division | Confidential – Official Use Only',105,290,{align:'center'});
    doc.text(`Page ${i} of ${pages}`,196,290,{align:'right'});
  }

  doc.save(`EDM_Inspection_${d.esevaiId||'report'}_${d.inspDate||Date.now()}.pdf`);
}

async function exportAllPDF(){
  const data=window._data;
  if(!data.length){alert('No data');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF('landscape');
  doc.setFillColor(15,23,42);doc.rect(0,0,297,28,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(14);doc.setFont(undefined,'bold');
  doc.text('EDM INSPECTIONS – ALL RECORDS',148,14,{align:'center'});
  doc.setFontSize(8);doc.setFont(undefined,'normal');
  doc.text(`Generated: ${new Date().toLocaleString('en-IN')} | Total: ${data.length}`,148,22,{align:'center'});
  doc.setTextColor(0,0,0);
  const hdrs=['#','Date','Esevai ID','Operator','EDM Name','Taluk','Type','Compliance','GPS'];
  const cw=[8,22,28,32,26,22,28,28,28];
  let x=8,y=36;
  doc.setFontSize(7);doc.setFont(undefined,'bold');doc.setFillColor(220,225,240);doc.rect(8,y-5,280,9,'F');
  hdrs.forEach((h,i)=>{doc.text(h,x+1,y);x+=cw[i];});y+=6;doc.setFont(undefined,'normal');
  data.forEach((d,i)=>{
    if(y>195){doc.addPage('','landscape');y=18;}
    x=8;
    const ts=d.timestamp?.toDate?.();
    const row=[String(i+1),d.inspDate||'—',d.esevaiId||'',d.operatorName||'',d.edmName||'',d.taluk||'',d.inspType||'',d.compliance||'',d.gpsPlace||''];
    if(i%2===0){doc.setFillColor(248,249,252);doc.rect(8,y-5,280,8,'F');}
    row.forEach((v,j)=>{doc.text(String(v).slice(0,14),x+1,y);x+=cw[j];});y+=9;
  });
  doc.save(`EDM_All_Inspections_${Date.now()}.pdf`);
}
